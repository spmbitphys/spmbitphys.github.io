<meta name="description" content="概述
课题组运行并维护多台低维量子材料制备及成像设备，包括：一套 1K–8T 的 STM/AFM系统，两套 MBE 系统，一套室温 AFM-MFM 系统。
扫描隧道显微镜/原子力显微镜

     
            Quanta这是一台定制设计的 STM，最低温度 1.2 K，磁场 8 T。它还能通过 SP-STM 模式实现表面磁性成像，以及通过 nc-AFM 模式实现分子化学键成像。此外，有两条高频线路连接至隧穿结，微波频率高于 20 GHz。
        



     
            Innova这是一台室温 AFM，可进行快速表面成像，也可实现 MFM 成像以及表面 KPFM 成像。
        


分子束外延系统

     
            MBE1这是一套自主搭建的 MBE 系统。它的超高真空腔体较小，最多可安装 7 个蒸发源。样品可加热至 1800 度。使用微型石英晶振仪校准材料沉积速率。可通过超高真空传递包实现原位样品转移。
        



     
            MBE2这是第二套自主搭建的 MBE 系统，与北京理工大学的肖文德教授合作研制。它的腔体更大，最多可安装 8 个蒸发源。样品可加热至 1800 度，并可通过离子溅射枪清洗。使用微型石英晶振仪校准材料沉积速率。它还保留了 RHEED 接口，用于进一步监测薄膜生长。可通过超高真空传递包实现原位样品转移。">

        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })

</script>
</body>
